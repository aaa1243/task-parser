name: Build EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check script for syntax errors
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\CombinedTaskParser.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw "Syntax errors found" }
          Write-Host "No syntax errors"

      - name: Test on a fake bypass task
        shell: powershell
        run: |
          $action  = New-ScheduledTaskAction -Execute 'C:\Windows\System32\cmd.exe' -Argument '/c powershell -nop -w hidden -c "echo test"'
          $trigger = New-ScheduledTaskTrigger -AtLogOn
          Register-ScheduledTask -TaskName 'SSParserTest' -Action $action -Trigger $trigger -Force | Out-Null
          try {
            .\CombinedTaskParser.ps1 -OutDir .\testout -NoOpen
            $csv = Get-ChildItem .\testout\tasks_*.csv | Select-Object -First 1
            if (-not $csv) { throw "No CSV written" }
            $rows = Import-Csv $csv.FullName
            Write-Host "Scanned $($rows.Count) tasks"
            $hit = $rows | Where-Object { $_.TaskPath -eq '/SSParserTest' }
            if (-not $hit) { throw "Test task not found in results" }
            Write-Host "Test task: $($hit.Severity) ($($hit.Score)) $($hit.Flags)"
            if ($hit.Severity -ne 'HIGH') { throw "Expected HIGH, got $($hit.Severity)" }
            Write-Host "Test passed"
          } finally {
            Unregister-ScheduledTask -TaskName 'SSParserTest' -Confirm:$false
          }

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile .\CombinedTaskParser.ps1 `
            -outputFile .\CombinedTaskParser.exe `
            -requireAdmin `
            -title "Combined Task Scheduler Parser" `
            -product "Combined Task Scheduler Parser" `
            -version "1.0.0"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CombinedTaskParser
          path: CombinedTaskParser.exe

      - name: Publish release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CombinedTaskParser.exe
